name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser used by the UI tests
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps ' || '' }}chromium-headless-shell

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        # GitHub's Ubuntu images block Electron's sandbox helper; tests run
        # without it. Real installs keep the sandbox.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:ci

      - name: Run tests
        if: runner.os != 'Linux'
        run: npm run test:ci

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
