name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser used by the UI tests
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps ' || '' }}chromium-headless-shell

      # Electron's sandbox helper must be owned by root with the setuid bit, as
      # the .deb/.rpm installers set it up; npm can't do that on its own.
      - name: Set up Electron's sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # the "github" reporter turns each failing test into an annotation on the run
      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ci -- --reporter=github,list

      - name: Run tests
        if: runner.os != 'Linux'
        run: npm run test:ci -- --reporter=github,list

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
